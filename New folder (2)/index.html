<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="registration-form">
        <h1>Create an Account</h1>
        <p class="title">Fill in the details to register</p>
        <form action="" class="signup_form">
            
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Your Name">
            <label for="emailadress">Email Adress</label>
            
            <input type="email" id="emailadress" placeholder="Your.email@example.com">
            
            <label for="password">Password</label>
          
            <input type="password" id="password" placeholder="*******">
            <button>Register</button>
            <p class="subtitle">Already have an account?<link rel="" href="Sign in"></p>
            <button class="signin_button">Sign In</button>
        </form>
    </div>
    
</body>
</html>
